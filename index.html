<h1>Scan &amp; Save</h1><p>Simple, private document scanning for iPhone.</p>
<h2>Help</h2><p>Scan a document, review the pages, and save it as a PDF. Your saved scans stay on your device unless you choose to share them.</p>
<p>For support, open an issue on the <a href="https://github.com/tildraev/scan-and-save-support/issues">GitHub support page</a>.</p>
